### ROOT PROJECT CONFIGURATION ###

### UNITY CONFIGURATION ###

# Versions
PackageVersion=0.3.3
UnityVersion=6000.5

# UPM Packaging and signing
UpmOrganizationId="_PLACEHOLDER_"
UpmServiceAccountKeyId="_PLACEHOLDER_"
UpmServiceAccountKeySecret="_PLACEHOLDER_"
UpmPackageDestination=build/upm-packages

# UPM npm publishing
UpmRegistry="_PLACEHOLDER_"
UpmRegistryUsername="_PLACEHOLDER_"
UpmRegistryPassword="_PLACEHOLDER_"

# Project Configuration
UnityProjectRoot=src/HELIX

### RIDER PLUGIN CONFIGURATION ###
DotnetPluginId=HelixRider
DotnetSolution=HelixRider.sln
RiderPluginId=dev.helight.helix
PluginVersion=0.0.1

BuildConfiguration=Debug

PublishToken="_PLACEHOLDER_"
# See https://www.jetbrains.com/intellij-repository/snapshots
# Keep in sync with SdkVersion in Plugin.props -->
#
# Examples:
#   Release:  2020.2
#   EAP:      2020.3-EAP2-SNAPSHOT
#   Nightly:  2020.3-SNAPSHOT
ProductVersion=2026.2

# Kotlin 1.4 will bundle the stdlib dependency by default, causing problems with the version bundled with the IDE
# https://blog.jetbrains.com/kotlin/2020/07/kotlin-1-4-rc-released/#stdlib-default
kotlin.stdlib.default.dependency=false

# Rider's Kotlin frontend compiles against the full IntelliJ/Rider/Unity classpath.
kotlin.daemon.jvmargs=-Xmx2g

# Required to download Rider artifacts from Maven (and not "binary" releases from CDN).
org.jetbrains.intellij.platform.buildFeature.useBinaryReleases=false
